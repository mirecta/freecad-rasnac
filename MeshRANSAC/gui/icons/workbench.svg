<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Mesh grid representing a 3D scan -->
  <rect x="8" y="8" width="48" height="48" rx="4" fill="#1a3a5c" opacity="0.9"/>
  <!-- Grid lines -->
  <line x1="8" y1="24" x2="56" y2="24" stroke="#4a9edd" stroke-width="1.2" opacity="0.6"/>
  <line x1="8" y1="40" x2="56" y2="40" stroke="#4a9edd" stroke-width="1.2" opacity="0.6"/>
  <line x1="24" y1="8" x2="24" y2="56" stroke="#4a9edd" stroke-width="1.2" opacity="0.6"/>
  <line x1="40" y1="8" x2="40" y2="56" stroke="#4a9edd" stroke-width="1.2" opacity="0.6"/>
  <!-- RANSAC detected plane (blue box) -->
  <rect x="14" y="14" width="36" height="12" rx="2" fill="#4a9edd" opacity="0.8"/>
  <!-- RANSAC detected cylinder (green circle) -->
  <ellipse cx="32" cy="44" rx="10" ry="8" fill="#2ecc71" opacity="0.8"/>
</svg>
