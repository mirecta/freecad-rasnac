<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Sphere with radial gradient -->
  <defs>
    <radialGradient id="sg" cx="40%" cy="35%" r="60%">
      <stop offset="0%"  stop-color="#f0a85a"/>
      <stop offset="100%" stop-color="#c0550a"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="24" fill="url(#sg)" stroke="#c0550a" stroke-width="1.2"/>
  <!-- Equator line -->
  <ellipse cx="32" cy="32" rx="24" ry="8" fill="none" stroke="#c0550a" stroke-width="0.9" opacity="0.5"/>
</svg>
